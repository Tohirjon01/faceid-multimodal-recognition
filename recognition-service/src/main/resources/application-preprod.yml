# ── PREPROD environment ─────────────────────────────────────────────
#  PostgreSQL + pgvector. Flyway creates the schema itself.
#  Demo data is seeded, which is what makes this useful for pilot testing.
#
#  Run with:
#    $env:APP_ENV="preprod"
#    $env:FACEID_DB_URL="jdbc:postgresql://localhost:5432/facedetection"
#    $env:FACEID_DB_USER="postgres"
#    $env:FACEID_DB_PASSWORD="..."
#    mvn spring-boot:run
#
#  pgvector is required. If the local PostgreSQL does not have it, use Neon
#  (free, pgvector preinstalled) or Docker: pgvector/pgvector:pg16

spring:
  datasource:
    url: ${FACEID_DB_URL:jdbc:postgresql://localhost:5432/facedetection}
    username: ${FACEID_DB_USER:postgres}
    password: ${FACEID_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: faceid-preprod-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      # Fail fast when the database is unreachable — better than a service
      # that is up but silently useless.
      initialization-fail-timeout: 10000

  flyway:
    enabled: true
    schemas: faceid
    create-schemas: true
    locations: classpath:db/migration
    baseline-on-migrate: true

faceid:
  demo:
    auto-seed: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,flyway

logging:
  level:
    uz.tuit.faceid: DEBUG
    org.flywaydb: INFO
