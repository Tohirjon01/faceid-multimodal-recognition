# analytics-service — shared settings
# Environments: test → preprod → prod (selected via APP_ENV)
#
# This service has no database of its own: events are pulled from
# recognition-service over HTTP. Whoever owns the log stores it.

spring:
  application:
    name: analytics-service

  profiles:
    active: ${APP_ENV:test}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

faceid:
  analytics:
    recognition-base-url: ${FACEID_RECOGNITION_URL:http://localhost:8082}
    event-window: 200
    max-event-window: 500
    # Without timeouts a slow upstream would tie up every Tomcat thread.
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-        }] %-42.42logger{39} : %msg%n"
  level:
    uz.tuit.faceid: INFO
